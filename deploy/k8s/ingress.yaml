# MS 로그인은 https 주소로만 돌아올 수 있어서(localhost 제외) TLS가 필요하다.
# host 를 바꾸면 config.env 의 PUBLIC_URL 과 Entra 앱의 리디렉션 URI(https://<host>/api/auth/callback)도 같이 바꾼다.
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: attije-order
spec:
  # 클러스터의 인그레스 클래스로 바꾼다. (kubectl get ingressclass)
  ingressClassName: nginx
  tls:
    - hosts:
        - attije.example.internal
      # 사내 인증서가 든 TLS 시크릿 이름으로 바꾼다.
      secretName: attije-order-tls
  rules:
    - host: attije.example.internal
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: attije-order
                port:
                  name: http
