# 주문·메뉴·팀원 데이터(SQLite 파일 attije.db)를 담는 볼륨. 파드 하나만 붙으므로 ReadWriteOnce면 된다.
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: attije-order-data
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 1Gi
  # 클러스터 기본 스토리지 클래스가 없으면 적는다. (kubectl get storageclass)
  # storageClassName: standard
