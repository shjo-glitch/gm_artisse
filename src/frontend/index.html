<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>아띠제 음료 주문 · 키오스크</title>
  <link rel="icon" href="/favicon.svg" type="image/svg+xml">
  <link rel="icon" href="/favicon-32.png" type="image/png" sizes="32x32">
  <link rel="apple-touch-icon" href="/apple-touch-icon.png">
  <link rel="stylesheet" href="/styles.css">
  <link rel="stylesheet" href="/kiosk.css">
</head>
<body class="kiosk">
  <header class="kiosk-bar">
    <div class="kiosk-bar__title">
      <img src="/favicon.svg" alt="" width="40" height="40">
      <div>
        <p class="eyebrow">Café Drink Order</p>
        <h1>아띠제 음료 주문</h1>
      </div>
    </div>
    <div class="kiosk-bar__actions">
      <button id="open-orders" class="kiosk-cart" type="button" aria-haspopup="dialog">
        <span class="kiosk-cart__label">주문 현황</span>
        <strong class="kiosk-cart__sum"><span id="order-count" class="kiosk-cart__num">0</span><small>잔</small><i aria-hidden="true">·</i><span id="order-total" class="kiosk-cart__num">0</span><small>원</small></strong>
      </button>
    </div>
  </header>

  <div id="closed-banner" class="kiosk-closed is-hidden" role="status" aria-live="polite">🔒 주문이 마감되었습니다. 관리자가 재개하면 다시 주문할 수 있습니다.</div>

  <nav id="category-tabs" class="kiosk-tabs" aria-label="음료 카테고리"></nav>

  <main class="kiosk-main">
    <section id="drink-grid" class="kiosk-grid" aria-live="polite" aria-busy="true"></section>
    <p id="kiosk-status" class="kiosk-status">메뉴를 불러오는 중입니다.</p>
  </main>

  <dialog id="drink-sheet" class="kiosk-sheet" aria-labelledby="sheet-title">
    <form id="sheet-form" method="dialog">
      <header class="kiosk-sheet__head">
        <div>
          <p id="sheet-category" class="eyebrow"></p>
          <h2 id="sheet-title" tabindex="-1" autofocus></h2>
          <p id="sheet-base" class="kiosk-sheet__base"></p>
        </div>
        <button class="kiosk-icon-button" type="button" data-close aria-label="닫기">&times;</button>
      </header>

      <div class="kiosk-sheet__body">
        <div id="custom-fields" class="kiosk-section is-hidden">
          <label class="kiosk-label" for="custom-name">메뉴 이름</label>
          <input id="custom-name" class="kiosk-input" type="text" autocomplete="off" placeholder="예: 시즌 한정 라떼">
          <label class="kiosk-label" for="custom-price">가격</label>
          <input id="custom-price" class="kiosk-input" type="number" min="0" step="100" inputmode="numeric" placeholder="예: 6500">
        </div>

        <fieldset id="temp-field" class="kiosk-section">
          <legend class="kiosk-label">온도</legend>
          <div id="temp-choices" class="kiosk-segment"></div>
        </fieldset>

        <fieldset id="size-field" class="kiosk-section">
          <legend class="kiosk-label">사이즈</legend>
          <div id="size-choices" class="kiosk-segment"></div>
        </fieldset>

        <div id="extra-groups"></div>

        <fieldset class="kiosk-section">
          <legend class="kiosk-label">요청사항 <span class="kiosk-hint">무료 · 여러 개 선택</span></legend>
          <div id="request-choices" class="kiosk-chips"></div>
          <input id="order-note" class="kiosk-input" type="text" maxlength="80" placeholder="그 밖의 요청 (선택)">
        </fieldset>

        <fieldset class="kiosk-section">
          <legend class="kiosk-label">주문자</legend>
          <div id="requester-choices" class="kiosk-chips kiosk-chips--names"></div>
        </fieldset>
      </div>

      <footer class="kiosk-sheet__foot">
        <p id="sheet-error" class="kiosk-error" role="alert"></p>
        <button id="sheet-submit" class="kiosk-submit" type="submit">
          <span id="sheet-submit-label">주문 담기</span>
          <strong><span id="sheet-total">0</span>원</strong>
        </button>
      </footer>
    </form>
  </dialog>

  <dialog id="orders-sheet" class="kiosk-sheet kiosk-sheet--side" aria-labelledby="orders-title">
    <header class="kiosk-sheet__head">
      <div>
        <p class="eyebrow">Orders</p>
        <h2 id="orders-title" tabindex="-1" autofocus>주문 현황</h2>
        <p class="kiosk-sheet__base">총 <strong id="orders-count">0</strong>잔 · <strong id="orders-total">0</strong>원</p>
      </div>
      <button class="kiosk-icon-button" type="button" data-close aria-label="닫기">&times;</button>
    </header>
    <div class="kiosk-sheet__body">
      <h3 class="kiosk-label">주문 목록</h3>
      <ul id="order-list" class="kiosk-orders"></ul>
      <p id="orders-empty" class="kiosk-status">아직 주문이 없습니다.</p>
      <h3 class="kiosk-label">주문 명세서</h3>
      <ul id="statement-list" class="kiosk-statement"></ul>
    </div>
  </dialog>

  <dialog id="confirm-sheet" class="kiosk-confirm" aria-labelledby="confirm-title" aria-describedby="confirm-message">
    <h2 id="confirm-title">주문 삭제</h2>
    <p id="confirm-message"></p>
    <div class="kiosk-confirm__actions">
      <button type="button" class="kiosk-confirm__cancel" data-close autofocus>취소</button>
      <button id="confirm-ok" type="button" class="kiosk-confirm__ok" data-confirm-ok>삭제</button>
    </div>
  </dialog>

  <div id="toast-container" class="toast-container" aria-live="polite" aria-atomic="false"></div>
  <script src="/kiosk.js"></script>
</body>
</html>
